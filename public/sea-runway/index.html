<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Locked</title>
<style>
:root{--bg:#f2f1ed;--ink:#1c1c1a;--mute:#75736d;--line:#d3d0c9;--sig:#e2561c}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--ink:#ecebe6;--mute:#9b9890;--line:#383732;--sig:#f26a2e;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:0 max(16px,env(safe-area-inset-left,0px))}
form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
#err{color:var(--sig);font-size:13px;min-height:1.2em;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <label><input id="keep" type="checkbox" checked style="padding:0"> Remember on this device</label>
  <button id="go">Open</button>
  <p id="err" role="alert"></p>
</form>
<script>
const KEY="sea-runway-pw";
async function open(pw){
  const buf=new Uint8Array(await (await fetch("content.bin",{cache:"no-cache"})).arrayBuffer());
  if(String.fromCharCode(...buf.subarray(0,4))!=="WIT1") throw new Error("Bad file");
  const it=new DataView(buf.buffer).getUint32(20,false);
  const mat=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:buf.subarray(4,20),iterations:it},mat,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.subarray(24,36)},key,buf.subarray(36)));
  document.open(); document.write(html); document.close();
}
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Opening…";
  const pw=document.getElementById("pw").value;
  try{ if(document.getElementById("keep").checked){try{localStorage.setItem(KEY,pw)}catch{}} await open(pw); }
  catch{ try{localStorage.removeItem(KEY)}catch{} err.textContent="Wrong password."; go.disabled=false; go.textContent="Open"; }
});
let saved=null; try{saved=localStorage.getItem(KEY)}catch{}
if(saved) open(saved).catch(()=>{try{localStorage.removeItem(KEY)}catch{}});
</script>
</body>
</html>
